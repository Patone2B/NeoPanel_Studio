              <li>QR code limité à l'adresse locale du PC.</li>
              <li>Accès prévu pour le réseau local de l'utilisateur.</li>
              <li>Contrôle des appareils autorisés depuis l'application PC.</li>
              <li>Possibilité de bloquer ou de déconnecter un appareil.</li>

          <p><strong>Aucun malware connu n'a été détecté dans les éléments indiqués.</strong></p>
